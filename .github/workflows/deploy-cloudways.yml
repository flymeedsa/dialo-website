name: Deploy dialo-website to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dialo-website-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install frontend dependencies and build assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CLOUDWAYS_SSH_PRIVATE_KEY }}

      - name: Trust Cloudways host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.CLOUDWAYS_SSH_PORT || 22 }}" "${{ secrets.CLOUDWAYS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release to the dedicated Cloudways application
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='storage/app/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='tests' \
            --exclude='.git' \
            ./ "${{ secrets.CLOUDWAYS_SSH_USER }}@${{ secrets.CLOUDWAYS_SSH_HOST }}:${{ secrets.CLOUDWAYS_DEPLOY_PATH }}/"

      - name: Run Laravel production tasks
        run: |
          ssh -p "${{ secrets.CLOUDWAYS_SSH_PORT || 22 }}" "${{ secrets.CLOUDWAYS_SSH_USER }}@${{ secrets.CLOUDWAYS_SSH_HOST }}" \
            "cd '${{ secrets.CLOUDWAYS_DEPLOY_PATH }}' && php artisan migrate --force && php artisan storage:link || true; php artisan optimize"
